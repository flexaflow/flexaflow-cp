services:
  judge:
    build: .
    image: contest-judge:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - judge-data:/data          # database lives here; survives rebuilds
    # The judge's sandbox (bubblewrap) creates user namespaces, which Docker's default
    # seccomp and AppArmor profiles block. These settings allow that. The sandbox still
    # runs with no network and no access to /data. See README "Docker".
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  judge-data:
